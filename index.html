<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bodega-kompasset</title>
<meta name="description" content="Et kompass som bare kan én ting: peke mot Bodega.">
<meta name="theme-color" content="#E8391D">
<link rel="icon" href="favicon.svg">
<meta property="og:title" content="Bodega-kompasset">
<meta property="og:description" content="Et kompass som bare kan én ting: peke mot Bodega.">
<script>
  /* Arc Search o.l. rapporterer viewport-høyde bak egen bunn-bar.
     Måles ÉN gang ved last — aldri på resize (da hopper layouten). */
  if (window.visualViewport) {
    document.documentElement.style.setProperty('--vvh', visualViewport.height + 'px');
  }
</script>
<style>
  /* ---------------------------------------------------------------
     BODEGA-KOMPASSET
     Ett instrument, én oppgave. Braun-logikk: svart skive,
     gul viser, alt annet holder kjeft.
     --------------------------------------------------------------- */

  @font-face{
    font-family:'Neureal';
    src:url('fonts/neureal-regular.otf') format('opentype');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }

  :root{
    /* Bodega-paletten (fra bodega-web): rødt hus, hvit skive, rød viser */
    --rod:  #E8391D;
    --hvit: #F7F5F0;

    --housing:  var(--rod);
    --dial:     var(--hvit);
    --ink:      var(--hvit);
    --ink-dim:  rgba(247,245,240,.62);
    --needle:   var(--rod);
    --index:    var(--hvit);   /* referansemerket "du" */
    --hairline: rgba(247,245,240,.35);
    --tick-major: rgba(232,57,29,.9);
    --tick-minor: rgba(232,57,29,.35);

    /* Neureal finnes kun som Regular — hierarkiet bæres av
       størrelse, spacing og farge, aldri faux-bold. */
    --face: 'Neureal','Neue Haas Grotesk Display Pro',
            'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background: var(--housing);
    color: var(--ink);
    font-family: var(--face);
    font-weight:400;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
    display:flex;
    justify-content:center;
    overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
  }

  .app{
    width:100%;
    max-width:420px;
    min-height:100svh;
    min-height:var(--vvh, 100svh);
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
  }

  /* --- topplinje ------------------------------------------------ */
  .masthead{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding-bottom:10px;
    border-bottom:1px solid var(--hairline);
  }
  .wordmark{
    font-size:15px;
    letter-spacing:.34em; text-transform:uppercase;
    color:inherit; text-decoration:none;
  }
  .kicker{
    font-size:10px;
    letter-spacing:.24em; text-transform:uppercase;
    color:var(--ink-dim);
  }

  /* --- skiven --------------------------------------------------- */
  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:34px;
    padding:34px 0;
  }
  .dial{
    width:min(78vw, 300px);
    aspect-ratio:1;
    display:block;
  }
  /* NB: ingen CSS transform-origin på ring/needle — rotate(a 150 150)-
     attributtet bærer sitt eget origo, og CSS-origin oppå KASTER
     elementene ut av viewBoxen (verifisert i Chrome). */

  #bubble{ fill:url(#bubGrad); }
  .bub-hi{ stop-color:var(--dial); }
  .bub-mid{ stop-color:var(--needle); }
  .bub-edge{ stop-color:var(--needle); }
  .ring-inner{ transition: stroke .2s; }
  #level.level .ring-inner{ stroke:var(--needle); }

  /* --- avlesning ------------------------------------------------ */
  .readout{ text-align:center; }
  .distance{
    font-size:clamp(52px, 17vw, 76px);
    letter-spacing:-.02em;
    line-height:.9;
    margin-left:-.085em;  /* Neureals venstre sidebæring */
  }
  .distance .unit{
    font-size:.30em;
    letter-spacing:.2em; margin-left:.34em;
    vertical-align:.55em; color:var(--ink-dim);
  }
  .caption{
    margin-top:12px;
    font-size:12px;
    letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-dim);
  }
  .caption strong{ color:var(--ink); font-weight:400; }

  /* --- bunnlinje ------------------------------------------------ */
  .footer{
    border-top:1px solid var(--hairline);
    padding-top:10px;
    display:flex;
    justify-content:space-between;
    gap:12px;
    font-size:10px;
    letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-dim);
  }

  /* --- knapp / meldinger ---------------------------------------- */
  .gate{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:22px;
    padding:34px 0;
  }
  .gate p{
    font-size:15px; line-height:1.5;
    max-width:26ch; color:var(--ink-dim);
  }
  .gate p b{ color:var(--ink); font-weight:400; }

  button{
    font-family:inherit;
    font-size:12px; font-weight:400;
    letter-spacing:.2em; text-transform:uppercase;
    color:var(--housing);
    background:var(--dial);
    border:0; border-radius:2px;
    padding:17px 26px;
    cursor:pointer;
  }
  button:active{ opacity:.85; }
  button:focus-visible{ outline:3px solid var(--index); outline-offset:3px; }

  [hidden]{ display:none !important; }

  /* --- framme: hele paletten inverterer ------------------------- */
  body.arrived{
    --housing:  var(--hvit);
    --dial:     var(--rod);
    --ink:      var(--rod);
    --ink-dim:  rgba(232,57,29,.65);
    --needle:   var(--hvit);
    --index:    var(--rod);
    --hairline: rgba(232,57,29,.35);
    --tick-major: rgba(247,245,240,.9);
    --tick-minor: rgba(247,245,240,.35);
  }
  body.arrived .hairline-hide{ display:none; }

  /* --- felttest-overlay (?debug=1) ------------------------------ */
  #debug{
    position:fixed; left:8px; top:8px; z-index:9;
    font:10px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing:0; text-transform:none;
    color:var(--rod);
    background:rgba(247,245,240,.95);
    border:1px solid rgba(232,57,29,.35);
    padding:8px 10px;
    white-space:pre;
    pointer-events:none;
  }
</style>
</head>
<body>

<div class="app">

  <header class="masthead">
    <a class="wordmark" href="https://bodega.part.no">Bodega</a>
    <span class="kicker" id="kicker">Kompass</span>
  </header>

  <!-- START ---------------------------------------------------- -->
  <section class="gate" id="gate">
    <p>Dette kompasset kan bare én ting: peke mot <b>Bodega</b>.<br>
       Det trenger posisjonen din og retningen telefonen peker.</p>
    <button id="start">Pek meg mot Bodega</button>
  </section>

  <!-- KOMPASS -------------------------------------------------- -->
  <section class="stage" id="stage" hidden>
    <svg class="dial" viewBox="0 0 300 300" aria-hidden="true">
      <defs>
        <!-- kuppel: mørkner mot kanten = konveks glassfølelse -->
        <radialGradient id="domeShade" cx="50%" cy="42%" r="62%">
          <stop offset="55%" stop-color="#000" stop-opacity="0"/>
          <stop offset="86%" stop-color="#000" stop-opacity=".06"/>
          <stop offset="100%" stop-color="#000" stop-opacity=".18"/>
        </radialGradient>
        <!-- bobla: lys oppe-venstre, mettet mot kanten = kule -->
        <radialGradient id="bubGrad" cx="38%" cy="32%" r="75%">
          <stop class="bub-hi"   offset="0%"  stop-opacity=".95"/>
          <stop class="bub-mid"  offset="45%" stop-opacity=".7"/>
          <stop class="bub-edge" offset="100%" stop-opacity="1"/>
        </radialGradient>
        <!-- myk slagskygge under bobla -->
        <radialGradient id="bubShadow" cx="50%" cy="50%" r="50%">
          <stop offset="55%" stop-color="#000" stop-opacity=".22"/>
          <stop offset="100%" stop-color="#000" stop-opacity="0"/>
        </radialGradient>
        <!-- speilblink i glasset -->
        <radialGradient id="spec" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="150" cy="150" r="150" fill="var(--dial)"/>

      <!-- gradring: roterer med verden -->
      <g class="ring" id="ring">
        <g id="ticks"></g>
      </g>

      <!-- libelle: dåselibell med glass-kuppel -->
      <g id="level" opacity="0">
        <circle cx="150" cy="150" r="64" fill="var(--dial)" stroke="var(--tick-minor)" stroke-width="1"/>
        <circle cx="150" cy="150" r="64" fill="url(#domeShade)"/>
        <circle cx="150" cy="150" r="44" fill="none" stroke="var(--tick-minor)" stroke-width="1"/>
        <circle class="ring-inner" cx="150" cy="150" r="22" fill="none" stroke="var(--tick-minor)" stroke-width="1.5"/>
        <g id="bubbleG">
          <circle cx="154" cy="156" r="25" fill="url(#bubShadow)"/>
          <circle id="bubble" cx="150" cy="150" r="20"/>
          <circle cx="143" cy="142" r="5.5" fill="var(--dial)" opacity=".85"/>
        </g>
        <ellipse cx="126" cy="116" rx="30" ry="13" fill="url(#spec)" transform="rotate(-32 126 116)"/>
      </g>

      <!-- viseren: peker mot Bodega -->
      <g class="needle" id="needle">
        <path d="M150 34 L163 74 L150 66 L137 74 Z" fill="var(--needle)"/>
        <rect x="147.5" y="66" width="5" height="76" fill="var(--needle)"/>
      </g>

      <circle cx="150" cy="150" r="7" fill="var(--housing)"/>

      <!-- fast referansemerke: der du står og ser -->
      <path d="M150 8 L157 -4 L143 -4 Z" fill="var(--index)" transform="translate(0,10)"/>
    </svg>

    <div class="readout">
      <div class="distance"><span id="dist">–</span><span class="unit" id="unit">m</span></div>
      <div class="caption" id="caption">Finner deg</div>
    </div>
  </section>

  <footer class="footer">
    <span id="accuracy">Kong Oscars gate 23</span>
    <span id="status" class="hairline-hide">Bergen</span>
  </footer>

</div>

<script>
(function () {
  'use strict';

  /* =============================================================
     Målet. Bytt disse hvis baren flytter seg.
     ============================================================= */
  const TARGET = { lat: 60.3937156, lon: 5.3298621 };

  const ARRIVED_M   = 15;   // regnes som framme
  const ALIGNED_DEG = 10;   // regnes som "rett fram"

  const $ = (id) => document.getElementById(id);
  const el = {
    gate: $('gate'), start: $('start'), stage: $('stage'),
    ring: $('ring'), needle: $('needle'), ticks: $('ticks'),
    dist: $('dist'), unit: $('unit'), caption: $('caption'),
    accuracy: $('accuracy'), status: $('status'), kicker: $('kicker'),
    level: $('level'), bubbleG: $('bubbleG')
  };

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DEBUG = new URLSearchParams(location.search).has('debug');

  /* ---- gradring ------------------------------------------------ */
  (function drawTicks() {
    let svg = '';
    for (let deg = 0; deg < 360; deg += 5) {
      const major = deg % 45 === 0;
      const len = major ? 15 : 7;
      const rad = (deg - 90) * Math.PI / 180;
      const x1 = 150 + Math.cos(rad) * 136, y1 = 150 + Math.sin(rad) * 136;
      const x2 = 150 + Math.cos(rad) * (136 - len), y2 = 150 + Math.sin(rad) * (136 - len);
      svg += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
              stroke="var(${major ? '--tick-major' : '--tick-minor'})"
              stroke-width="${major ? 2 : 1}"/>`;
    }
    el.ticks.innerHTML = svg;
  })();

  /* ---- geometri ------------------------------------------------ */
  const rad = (d) => d * Math.PI / 180;

  function distanceTo(lat, lon) {
    const R = 6371000;
    const dLat = rad(TARGET.lat - lat), dLon = rad(TARGET.lon - lon);
    const a = Math.sin(dLat / 2) ** 2 +
              Math.cos(rad(lat)) * Math.cos(rad(TARGET.lat)) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function bearingTo(lat, lon) {
    const φ1 = rad(lat), φ2 = rad(TARGET.lat), Δλ = rad(TARGET.lon - lon);
    const y = Math.sin(Δλ) * Math.cos(φ2);
    const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }

  /* ---- tilstand ------------------------------------------------ */
  let bearing = null;      // grader mot Bodega, fra nord
  let heading = null;      // grader du peker, fra nord
  let distance = null;

  /* Kilde-prioritet: en svakere kilde får aldri overstyre en sterkere.
     3 webkit (iOS)  2 euler (absolute, Android)  1 gps */
  let source = 'ingen';
  let sourceRank = 0;

  let shownNeedle = 0, shownRing = 0;   // utjevnede vinkler
  let tiltBeta = null, tiltGamma = null;      // helning, til libellen
  let shownBubX = 0, shownBubY = 0;           // boble-forskyvning fra sentrum

  const dbg = { doa: 0, dor: 0, revives: 0, perm: '-', alpha: null, beta: null, gamma: null, webkit: null };

  let started = false;     // brukeren har trykket start
  let permDenied = false;  // kompass-tilgang aktivt avslått (iOS)
  let watchId = null;

  function setHeading(h, name, rank) {
    if (rank < sourceRank) return;
    heading = ((h % 360) + 360) % 360;
    source = name;
    sourceRank = rank;
    render();
  }

  /* ---- retning: deviceorientation ------------------------------
     (Bevisst INGEN AbsoluteOrientationSensor: håndregnet kvaternion-
     projeksjon ga feil kurs når telefonen holdes oppreist på Android.
     W3C-formelen under er den feltprøvde referansen.) */
  function eulerHeading(alpha, beta, gamma) {
    // W3C-spec-eksempelet: tilt-kompensert kurs = horisontal projeksjon
    // av enhetens -z-akse. Vipping flytter ikke kursen.
    const d = Math.PI / 180;
    const _x = (beta || 0) * d, _y = (gamma || 0) * d, _z = (alpha || 0) * d;
    const cX = Math.cos(_x), cY = Math.cos(_y), cZ = Math.cos(_z);
    const sX = Math.sin(_x), sY = Math.sin(_y), sZ = Math.sin(_z);
    const Vx = -cZ * sY - sZ * sX * cY;
    const Vy = -sZ * sY + cZ * sX * cY;
    return Math.atan2(Vx, Vy) * 180 / Math.PI;
  }

  function onOrientation(e) {
    if (e.type === 'deviceorientationabsolute') dbg.doa++; else dbg.dor++;
    dbg.alpha = e.alpha; dbg.beta = e.beta; dbg.gamma = e.gamma;
    dbg.webkit = e.webkitCompassHeading;

    // Helning til libellen — tyngdekraft trenger ikke kompass,
    // så her duger også relative events.
    if (typeof e.beta === 'number' && typeof e.gamma === 'number') {
      tiltBeta = e.beta; tiltGamma = e.gamma;
    }

    if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) {
      // iOS: tilt-kompensert, relativ til toppen av skjermen → skjermvinkel legges til
      const screenAngle = (screen.orientation && screen.orientation.angle) || 0;
      setHeading(e.webkitCompassHeading + screenAngle, 'webkit', 3);
    } else if (e.absolute === true && typeof e.alpha === 'number') {
      setHeading(eulerHeading(e.alpha, e.beta, e.gamma), 'euler', 2);
    }
    // Relative events uten webkitCompassHeading brukes ALDRI:
    // gyro med vilkårlig nullpunkt = pil som driver.
  }

  function listenOrientation() {
    window.addEventListener('deviceorientationabsolute', onOrientation, true);
    window.addEventListener('deviceorientation', onOrientation, true);
  }

  /* ---- posisjon ------------------------------------------------ */
  function watchPosition() {
    if (!('geolocation' in navigator)) return fail('Ingen posisjon i denne nettleseren');

    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        const { latitude, longitude, accuracy, heading: course, speed } = pos.coords;
        bearing  = bearingTo(latitude, longitude);
        distance = distanceTo(latitude, longitude);

        // Siste utvei uten kompass: GPS-kurs — men bare i reell bevegelse,
        // ellers gir stillestående GPS-støy en pil som vandrer.
        if (sourceRank <= 1 &&
            typeof course === 'number' && !isNaN(course) &&
            typeof speed === 'number' && speed > 0.5) {
          setHeading(course, 'gps', 1);
        }

        el.accuracy.textContent = accuracy ? `Nøyaktighet ±${Math.round(accuracy)} m` : 'Kong Oscars gate 23';
        render();
      },
      (err) => {
        fail(err.code === err.PERMISSION_DENIED
          ? 'Posisjon er avslått for denne siden. I Safari: trykk aA i adressefeltet → Innstillinger for nettsted → Posisjon → Tillat. Privat fane blokkerer også posisjon.'
          : 'Fikk ikke tak i posisjonen din.');
      },
      { enableHighAccuracy: true, maximumAge: 3000, timeout: 20000 }
    );
  }

  /* ---- gjenoppliving ---------------------------------------------
     iOS/WKWebView fryser siden i bakgrunnen og dreper posisjonsvakt
     og sensor-events i stillhet — uten dette henger siden på siste
     avlesning når du kommer tilbake. */
  function revive() {
    dbg.revives++;
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    watchPosition();
    window.removeEventListener('deviceorientationabsolute', onOrientation, true);
    window.removeEventListener('deviceorientation', onOrientation, true);
    listenOrientation();
  }

  document.addEventListener('visibilitychange', () => {
    if (!started) return;
    if (document.visibilityState === 'visible') {
      revive();
    } else if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
  });

  // bfcache: tilbake-navigasjon gjenoppretter siden med dødt sensor-oppsett
  window.addEventListener('pageshow', (e) => {
    if (started && e.persisted) revive();
  });

  /* ---- tegning -------------------------------------------------- */
  function shortestTurn(from, to) {
    return from + ((((to - from) % 360) + 540) % 360) - 180;
  }

  function render() {
    if (distance === null) return;

    // avstand
    if (distance >= 1000) {
      el.dist.textContent = (distance / 1000).toFixed(1).replace('.', ',');
      el.unit.textContent = 'km';
    } else {
      el.dist.textContent = Math.round(distance);
      el.unit.textContent = 'm';
    }

    // framme?
    if (distance <= ARRIVED_M) {
      document.body.classList.add('arrived');
      el.caption.innerHTML = '<strong>Du står i Bodega</strong>';
      el.kicker.textContent = 'Framme';
      return;
    }
    document.body.classList.remove('arrived');
    el.kicker.textContent = 'Kompass';

    if (heading === null) {
      el.caption.textContent = permDenied ? 'Kompass avslått – gå noen skritt' : 'Finner retning';
      el.status.textContent  = permDenied ? 'Uten kompass' : 'Bergen';
      return;
    }

    const delta = ((bearing - heading) % 360 + 360) % 360;
    const off   = Math.min(delta, 360 - delta);

    el.caption.innerHTML = off < ALIGNED_DEG
      ? '<strong>Rett fram</strong>'
      : (delta < 180 ? 'Til høyre' : 'Til venstre');
    el.status.textContent = source === 'gps' ? 'Uten kompass' : 'Bergen';
  }

  /* ---- felttest-overlay ----------------------------------------- */
  let debugEl = null;
  function renderDebug() {
    if (!DEBUG) return;
    if (!debugEl) {
      debugEl = document.createElement('div');
      debugEl.id = 'debug';
      document.body.appendChild(debugEl);
    }
    const f = (v, n = 1) => (typeof v === 'number' && !isNaN(v)) ? v.toFixed(n) : '–';
    debugEl.textContent =
      `kilde    ${source} (rank ${sourceRank})\n` +
      `events   doa ${dbg.doa}  do ${dbg.dor}  rev ${dbg.revives}\n` +
      `perm     ${dbg.perm}\n` +
      `webkit   ${f(dbg.webkit)}\n` +
      `αβγ      ${f(dbg.alpha)} ${f(dbg.beta)} ${f(dbg.gamma)}\n` +
      `screen∠  ${(screen.orientation && screen.orientation.angle) || 0}\n` +
      `heading  ${f(heading)}\n` +
      `bearing  ${f(bearing)}\n` +
      `avstand  ${f(distance, 0)} m`;
  }

  /* ---- animasjon ------------------------------------------------ */
  function animate() {
    if (bearing !== null && heading !== null) {
      const targetNeedle = ((bearing - heading) % 360 + 360) % 360;
      const targetRing   = (-heading % 360 + 360) % 360;

      if (reduceMotion) {
        shownNeedle = targetNeedle; shownRing = targetRing;
      } else {
        shownNeedle += (shortestTurn(shownNeedle, targetNeedle) - shownNeedle) * 0.16;
        shownRing   += (shortestTurn(shownRing,   targetRing)   - shownRing)   * 0.16;
      }
      el.needle.setAttribute('transform', `rotate(${shownNeedle.toFixed(2)} 150 150)`);
      el.ring.setAttribute('transform',   `rotate(${shownRing.toFixed(2)} 150 150)`);
    }

    // libellen: bobla søker mot høyeste punkt, ±30° gir fullt utslag
    if (tiltBeta !== null) {
      el.level.setAttribute('opacity', '1');
      const lim = (v) => Math.max(-1, Math.min(1, v / 30));
      const tx = -lim(tiltGamma) * 40;
      const ty = -lim(tiltBeta) * 40;
      if (reduceMotion) { shownBubX = tx; shownBubY = ty; }
      else {
        shownBubX += (tx - shownBubX) * 0.16;
        shownBubY += (ty - shownBubY) * 0.16;
      }
      el.bubbleG.setAttribute('transform', `translate(${shownBubX.toFixed(1)} ${shownBubY.toFixed(1)})`);
      el.level.classList.toggle('level',
        Math.abs(tiltBeta) < 2.5 && Math.abs(tiltGamma) < 2.5);
    }
    renderDebug();
    requestAnimationFrame(animate);
  }

  /* ---- feil ----------------------------------------------------- */
  function fail(message) {
    el.stage.hidden = true;
    el.gate.hidden = false;
    el.gate.innerHTML = `<p>${message}</p><button onclick="location.reload()">Prøv igjen</button>`;
    el.kicker.textContent = 'Ute av drift';
  }

  /* ---- start ---------------------------------------------------- */
  el.start.addEventListener('click', async () => {
    el.start.disabled = true;
    el.start.textContent = 'Sikter inn …';

    // iOS krever at dette skjer på et trykk. Noen nettlesere (Arc Search o.l.)
    // har requestPermission som feiler — da lytter vi likevel: kommer det
    // ingen events, faller vi til GPS-kurs.
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        dbg.perm = await DeviceOrientationEvent.requestPermission();
      } else {
        dbg.perm = 'ikke påkrevd';
      }
    } catch (e) { dbg.perm = 'feilet'; }
    permDenied = dbg.perm === 'denied';

    listenOrientation();
    started = true;

    el.gate.hidden = true;
    el.stage.hidden = false;
    watchPosition();
    animate();
  });

})();
</script>
